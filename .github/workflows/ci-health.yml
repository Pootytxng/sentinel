# CI health — asks once a day whether `main` is green, and files an issue when it is not.
#
# main's CI was red for two days and nobody noticed, because the only thing that ever reads a run's
# conclusion is a human who happens to open the Actions tab. This job is that reader, on a schedule,
# so a broken trunk does not wait for someone to show up.
#
# Deliberately NOT triggered by push or pull_request. A push-triggered health check tells you about
# the run it was triggered by, which you can already see; the whole point is to notice on a day when
# nobody pushes anything.
#
# The workflow's own red/green means exactly ONE thing: whether the reporter could do its job. A red
# `main` is reported through the issue it files, never by failing this workflow — otherwise "main is
# broken" and "the reporter is broken" would look identical in the Actions tab, and the second one
# would go unfixed.
#
# ---------------------------------------------------------------------------------------------
# DORMANT since 2026-08-10 — the schedule is removed, dispatch is kept.
#
# Two independent reasons, either of which is sufficient:
#
# 1. There is nothing left to read. ci.yml is manual-only now (its header carries the arithmetic),
#    so `main` no longer has a CI conclusion that tracks `main`. A daily reader of the last run
#    would report on whatever someone last dispatched, days ago, and file issues about it. A
#    watchdog reporting stale state is worse than no watchdog, by this file's own argument.
#
# 2. It cannot see the outage that matters. Between 7 and 10 August every job in this repository was
#    rejected before a runner was assigned — including this one. Five consecutive daily runs died in
#    ~4 seconds with zero steps and filed nothing, because a hosted watchdog cannot report an outage
#    whose definition is "hosted jobs do not start". That is structural, not a bug to fix here.
#
# So the job of noticing moved off GitHub entirely: `npm run verify:local` runs on the owner's desk
# and fails a push directly, which needs no runner, no schedule and no allowance to be true.
# Restoring the schedule only makes sense once ci.yml has an automatic trigger again.
# ---------------------------------------------------------------------------------------------

name: CI health

on:
  workflow_dispatch:

concurrency: ci-health

permissions:
  contents: read
  issues: write
  actions: read # reading CI's own run conclusions is an Actions read, not a contents read

jobs:
  report:
    name: Report main's CI health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # One file is all this needs. A full checkout would cost more than the job.
          sparse-checkout: scripts/ci-health-report.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Assess and report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci-health-report.mjs
