name: CI

# Minimal anti-drift CI: build + test + lint the Rust backend and the React/TS frontend,
# plus an informational dependency audit. Added 2026-06-26 in response to an external audit
# that flagged the absence of CI as a drift risk.
#
# Cost note (ZERO-BUDGET LAW): the Rust job lives in ci-rust.yml because it runs on windows-latest
# (2x multiplier) and the crate pulls Windows-only deps (windows / winreg / wmi / ferrisetw / runas /
# adlx) that will not compile elsewhere. This workflow is ubuntu-latest (1x) only.
#
# ---------------------------------------------------------------------------------------------
# THIS WORKFLOW HAS EXHAUSTED THE FREE ALLOWANCE TWICE. 9 July, then again 7 August.
#
# July: 2,195 billed vs 2,000 included, and CI stayed dead for 22 days without anyone noticing,
# because the failure did not look like one -- jobs were rejected before a runner was assigned
# (zero steps, zero billable ms) and surfaced as red X's that no test had produced. The 2026-08-01
# fixes moved the informational audit to audit.yml (645 min, the largest consumer) and stopped
# docs-only commits from starting runners.
#
# It walled again six days later, and the second measurement is why the shape below changed:
#
#   job                             runner    raw     x    BILLED   share
#   Rust (test + clippy)            windows    506    2     1,012     62%
#   Frontend (test + build)         ubuntu     583    1       583     36%
#   health + audit + deploy         ubuntu      24    1        24      2%
#                                                          -------
#                                              1,619 in SEVEN DAYS   (>6,900/month projected)
#
# The 2026-08-01 fixes were sound and were not the problem. Development velocity was: 593 commits
# to main in 30 days, 91 CI runs in 7. No paths filter survives a 3.5x overrun, so the two structural
# wastes had to go instead.
#
# Fix 3 (here): `push: main` is gone. 54 of those 91 runs -- 59% -- were pushes to main re-testing a
# commit its own PR had tested minutes earlier, at full price, to produce an answer already known.
# The PR is the gate; the merge is not a second event worth paying for.
# Fix 4 (ci-rust.yml): only 58 of those 593 commits -- 9.8% -- touched src-tauri/ at all. The most
# expensive job in the repository was running in full on every frontend and tooling commit. It is
# now its own workflow, scoped to the paths that can actually change its answer.
#
# Projected after both: ~1,250 billed/month against 2,000. `scripts/ci-budget-guard.test.mjs` holds
# the arithmetic and re-derives velocity from git history rather than trusting a constant -- the
# previous projection stayed green through this entire overrun because it pinned the CONFIG and
# assumed July's run count forever.
#
# The real gate is now `npm run verify`, which runs every one of these checks locally in ~3.5 min
# (scripts/verify-like-ci.mjs). Hosted CI is the second opinion, not the safety net.
# ---------------------------------------------------------------------------------------------

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  # Kept so a suspected outage, or a main that drifted from the PR that tested it, can be checked
  # on demand instead of waiting for the next pull request.
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `actions/checkout@v4` clones SINGLE-BRANCH by default, so refs/remotes/origin/* holds one
      # ref. scripts/branch-disposition-audit.mjs reads that cache; on 2026-08-05 it read the near-
      # empty cache as the truth about the remote and emitted 21 instructions to delete 21 correct
      # rows, one of them the LOCKED frozen beta ref. The script now refuses to speak about origin
      # from a clone that cannot see it — this step is what lets it speak.
      #
      # Refs only, no history: `--depth=1` keeps this at a couple of seconds and a few hundred KB
      # (ZERO-BUDGET LAW), which is all the existence half of the audit needs. Ancestry stays absent,
      # so merge-tree re-proof is honestly SKIPPED rather than faked — the audit prints PARTIAL and
      # says which half it checked. `fetch-depth: 0` would buy the other half for a full clone of
      # every branch on every run, which is not a trade this budget can make.
      - name: fetch the branch NAMES the disposition audit checks against
        run: |
          git config --replace-all remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*'
          git fetch --no-tags --prune --depth=1 origin

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # The site guards (dist-site staleness, landing, SEO) need site-app's own dependencies and one
      # staged build; without them three suites fail with "site-app dependencies missing — run
      # `npm ci` inside site-app/ first", which is a missing setup step wearing the costume of a
      # broken test. Taken from PR #9, open since 26 July and never able to go green because CI
      # itself was dead. Adds ~1.7 min per run on a 1x runner; the budget guard's projection
      # accounts for it.
      - run: npm ci
        working-directory: site-app
      - name: stage the site once, for the site guards
        run: npm run stage:site

      - name: vitest
        run: npm test
      - name: type-check + build
        run: npm run build
