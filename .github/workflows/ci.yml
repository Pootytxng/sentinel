name: CI

# Build + test + lint the Rust backend and the React/TS frontend. Added 2026-06-26 in response to an
# external audit that flagged the absence of CI as a drift risk.
#
# MANUAL-ONLY since 2026-08-10. This workflow no longer starts itself. Read on before restoring a
# trigger — the reason is arithmetic, and it has now defeated two rounds of per-run cost-cutting.
#
# ---------------------------------------------------------------------------------------------
# THE ALLOWANCE HAS NOW BEEN EXHAUSTED TWICE, AND THE SECOND TIME THE COST-CUTTING WAS ALREADY IN.
#
# Round 1 (July): 2,195 billed minutes vs 2,000 included. Diagnosed as per-run cost. The audit job
# moved to audit.yml/weekly, docs-only commits stopped starting runners, and a budget guard was
# written that projected 1,180 billed minutes a month -- comfortably under.
#
# Round 2 (August), measured from GitHub's run history for 1-7 Aug:
#
#   111 real CI runs in SIX DAYS   ->   ~570 runs/month
#   the guard's projection assumed      122 runs/month
#
# That is 4.7x, and it is why the guard stayed green while the budget burned: RUNS_PER_MONTH was a
# hard-coded constant, so the one number that actually moved was the one nothing was watching. The
# included minutes ran out around 06:00 UTC on 7 August. Every job since is rejected before a runner
# is assigned -- 0 steps, ~1 second, and GitHub's generic annotation about payments or a spending
# limit.
#
# THAT ANNOTATION IS MISLEADING AND HAS COST A SESSION BEFORE: there is no payment problem. The
# owner checked his dashboard live on 2026-07-16 -- no failed payment, billed $0 -- and the account
# runs a DELIBERATE $0 Actions budget with stop-usage on, under the zero-budget law. Hosted CI being
# blocked is the intended steady state, and the owner directed that the spend never be re-asked
# (docs/RELEASE_STATE.md "Hosted CI"; the OWNER DECREE 2026-07-16 in docs/BACKLOG.md). Do not chase
# a billing bug, and do not ask him to raise the limit.
#
# Nothing about per-run cost caused this. Run VOLUME did. Several agent lanes now push to `main` and
# to PR branches all day: 63 pushes to main alone in those six days, plus 48 pull_request events.
# At ~4 min of Rust (windows, 2x) + ~4 min of frontend (ubuntu, 1x) per run, 570 runs a month is
# ~6,800 billed minutes against a 2,000-minute allowance. No amount of caching closes a 3.4x gap.
#
# So the trigger is the thing that had to go, not the steps. Verification moved to the machine that
# was always going to be cheaper than a runner: `npm run verify:local` (scripts/verify-local.ps1),
# wired to a pre-push hook, running these same checks on the owner's desk for zero minutes.
#
# What this file is FOR now: a second opinion on a clean Linux/Windows runner when one is genuinely
# wanted -- a release cut, a suspected works-on-my-machine, a dependency bump. Run it from the
# Actions tab. It costs ~12 billed minutes when you ask for it, and nothing when you do not.
#
# `scripts/ci-budget-guard.test.mjs` now asserts this mechanically: no workflow here may carry an
# automatic push/pull_request trigger except the path-scoped site deploy. A projection could be
# wrong; that assertion cannot be, which is the whole lesson of round 2.
# ---------------------------------------------------------------------------------------------
on:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (test + clippy)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # No explicit toolchain here on purpose: rustup on the runner reads rust-toolchain.toml, so CI
      # and the owner's desk resolve the SAME channel and components from one file. Naming @stable
      # here as well would be a second source of truth for the same fact, and the first time they
      # disagreed the local release gate would silently be the weaker one — which is exactly what
      # happened on 2026-08-01 (local 1.95 vs CI 1.97, two clippy lints apart).
      - name: show the toolchain rust-toolchain.toml selected
        run: rustc --version && cargo clippy --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: cargo clippy (deny warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `actions/checkout@v4` clones SINGLE-BRANCH by default, so refs/remotes/origin/* holds one
      # ref. scripts/branch-disposition-audit.mjs reads that cache; on 2026-08-05 it read the near-
      # empty cache as the truth about the remote and emitted 21 instructions to delete 21 correct
      # rows, one of them the LOCKED frozen beta ref. The script now refuses to speak about origin
      # from a clone that cannot see it — this step is what lets it speak.
      #
      # Refs only, no history: `--depth=1` keeps this at a couple of seconds and a few hundred KB
      # (ZERO-BUDGET LAW), which is all the existence half of the audit needs. Ancestry stays absent,
      # so merge-tree re-proof is honestly SKIPPED rather than faked — the audit prints PARTIAL and
      # says which half it checked. `fetch-depth: 0` would buy the other half for a full clone of
      # every branch on every run, which is not a trade this budget can make.
      - name: fetch the branch NAMES the disposition audit checks against
        run: |
          git config --replace-all remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*'
          git fetch --no-tags --prune --depth=1 origin

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # The site guards (dist-site staleness, landing, SEO) need site-app's own dependencies and one
      # staged build; without them three suites fail with "site-app dependencies missing — run
      # `npm ci` inside site-app/ first", which is a missing setup step wearing the costume of a
      # broken test. Taken from PR #9, open since 26 July and never able to go green because CI
      # itself was dead. Adds ~1.7 min per run on a 1x runner; the budget guard's projection
      # accounts for it.
      - run: npm ci
        working-directory: site-app
      - name: stage the site once, for the site guards
        run: npm run stage:site

      - name: vitest
        run: npm test
      - name: type-check + build
        run: npm run build
