name: CI

# Minimal anti-drift CI: build + test + lint the Rust backend and the React/TS frontend,
# plus an informational dependency audit. Added 2026-06-26 in response to an external audit
# that flagged the absence of CI as a drift risk.
#
# Cost note (ZERO-BUDGET LAW): the Rust job runs on windows-latest (2x minute multiplier) because
# the crate pulls Windows-only deps (windows / winreg / wmi / ferrisetw / runas / adlx) and will not
# compile elsewhere. The frontend job runs on ubuntu-latest (1x) to keep minutes down.
# Triggers are scoped to main + PRs only (not every branch push). Caches keep re-runs cheap.
#
# ---------------------------------------------------------------------------------------------
# 2026-08-01, measured: THIS WORKFLOW EXHAUSTED THE FREE ALLOWANCE AND STOPPED CI FOR 22 DAYS.
#
# July's actual usage, from GitHub's own metrics (1,650 raw minutes / 366 job runs):
#
#   job                              runner    raw    x    BILLED
#   Dependency audit (informational) ubuntu    645    1      645   <- moved to audit.yml, weekly
#   Rust (test + clippy)             windows   545    2    1,090
#   Frontend (test + build)          ubuntu    460    1      460
#                                                          -----
#                                                          2,195   vs 2,000 included
#
# It ran out on 9 July. Every run afterwards was rejected before a runner was assigned -- 7 seconds,
# zero steps, zero billable ms -- which surfaces as three red X's on every PR that no test produced.
# A dead gate that LOOKS like a failing gate is worse than an absent one, so the cost of this file
# is now part of its contract and `scripts/ci-budget-guard.test.mjs` fails the build if it drifts.
#
# Fix 1 (here): 226 of July's 535 commits to main -- 42% -- touched ONLY docs and markdown. Those
# cannot change what a test proves, so they no longer start runners.
# Fix 2 (audit.yml): the informational audit was the largest single consumer and is
# `continue-on-error`, so it can never fail a build. Weekly is enough for a dependency advisory.
# ---------------------------------------------------------------------------------------------

# The two paths-ignore lists are written out twice on purpose. A YAML anchor/alias would be the
# obvious de-duplication, but GitHub Actions' workflow parser does not support anchors, and a
# workflow that silently fails to parse is precisely the invisible-outage failure this whole change
# exists to prevent. ci-budget-guard.test.mjs asserts both blocks carry the list, so they cannot
# drift apart unnoticed.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (test + clippy)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # No explicit toolchain here on purpose: rustup on the runner reads rust-toolchain.toml, so CI
      # and the owner's desk resolve the SAME channel and components from one file. Naming @stable
      # here as well would be a second source of truth for the same fact, and the first time they
      # disagreed the local release gate would silently be the weaker one — which is exactly what
      # happened on 2026-08-01 (local 1.95 vs CI 1.97, two clippy lints apart).
      - name: show the toolchain rust-toolchain.toml selected
        run: rustc --version && cargo clippy --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: cargo clippy (deny warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `actions/checkout@v4` clones SINGLE-BRANCH by default, so refs/remotes/origin/* holds one
      # ref. scripts/branch-disposition-audit.mjs reads that cache; on 2026-08-05 it read the near-
      # empty cache as the truth about the remote and emitted 21 instructions to delete 21 correct
      # rows, one of them the LOCKED frozen beta ref. The script now refuses to speak about origin
      # from a clone that cannot see it — this step is what lets it speak.
      #
      # Refs only, no history: `--depth=1` keeps this at a couple of seconds and a few hundred KB
      # (ZERO-BUDGET LAW), which is all the existence half of the audit needs. Ancestry stays absent,
      # so merge-tree re-proof is honestly SKIPPED rather than faked — the audit prints PARTIAL and
      # says which half it checked. `fetch-depth: 0` would buy the other half for a full clone of
      # every branch on every run, which is not a trade this budget can make.
      - name: fetch the branch NAMES the disposition audit checks against
        run: |
          git config --replace-all remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*'
          git fetch --no-tags --prune --depth=1 origin

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # The site guards (dist-site staleness, landing, SEO) need site-app's own dependencies and one
      # staged build; without them three suites fail with "site-app dependencies missing — run
      # `npm ci` inside site-app/ first", which is a missing setup step wearing the costume of a
      # broken test. Taken from PR #9, open since 26 July and never able to go green because CI
      # itself was dead. Adds ~1.7 min per run on a 1x runner; the budget guard's projection
      # accounts for it.
      - run: npm ci
        working-directory: site-app
      - name: stage the site once, for the site guards
        run: npm run stage:site

      - name: vitest
        run: npm test
      - name: type-check + build
        run: npm run build
