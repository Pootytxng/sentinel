# cargo-audit configuration.
#
# Every advisory ignored below is an **unmaintained / unsound WARNING** (not a vulnerability) on a
# TRANSITIVE dependency that does not affect Compy's shipped Windows binary. Reviewed 2026-06-04:
# `cargo audit` reported 0 actual vulnerabilities. Ignoring this known, triaged noise keeps the scan
# a clean gate, so a *real* future CVE stands out instead of hiding in 17 lines of GTK warnings.
# Re-review when Tauri / wry update their bindings (these should drop off on their own).

[advisories]
ignore = [
  # ── Linux GTK3 / glib GUI stack ──────────────────────────────────────────
  # Pulled transitively by Tauri/wry for the LINUX target only — not compiled or shipped on
  # Windows (Compy is Windows-only). "gtk-rs GTK3 bindings no longer maintained" + one glib
  # VariantStrIter iterator-unsoundness. None of this code runs on the user's PC.
  "RUSTSEC-2024-0411", # gdkwayland-sys
  "RUSTSEC-2024-0412", # gdk
  "RUSTSEC-2024-0413", # atk
  "RUSTSEC-2024-0414", # gdkx11-sys
  "RUSTSEC-2024-0415", # gtk
  "RUSTSEC-2024-0416", # atk-sys
  "RUSTSEC-2024-0417", # gdkx11
  "RUSTSEC-2024-0418", # gdk-sys
  "RUSTSEC-2024-0419", # gtk3-macros
  "RUSTSEC-2024-0420", # gtk-sys
  "RUSTSEC-2024-0429", # glib (VariantStrIter unsoundness)
  # ── Unmaintained build / transitive helpers ──────────────────────────────
  # No runtime security impact; build-time or deep-transitive Unicode-table crates.
  "RUSTSEC-2024-0370", # proc-macro-error (build-time proc-macro helper)
  "RUSTSEC-2025-0075", # unic-char-range
  "RUSTSEC-2025-0080", # unic-common
  "RUSTSEC-2025-0081", # unic-char-property
  "RUSTSEC-2025-0098", # unic-ucd-version
  "RUSTSEC-2025-0100", # unic-ucd-ident
]
