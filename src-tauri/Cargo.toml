[package]
name = "compy"
version = "0.9.26"
description = "Hardware-aware Windows PC optimization for everyday gamers"
authors = ["Kuya"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "compy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` enables the opt-in "minimize to tray" (Behavior setting, default OFF — close still
# fully exits per Train #3 §1). Backend-only API; adds no webview capability.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# Single-instance guard: a second launch focuses the existing main window instead
# of starting another process — prevents two windows racing history.json. Backend
# only (no webview commands); the --fps-capture helper returns from main.rs before
# tauri::Builder, so it never registers this plugin and is unaffected.
tauri-plugin-single-instance = "2"
# Native OS notification for the session-end "debrief ready" toast (read-only, no auto-open).
tauri-plugin-notification = "2"
# In-app updater (ARMED 2026-07-22, owner decision): checks the public Pootytxng/compy-releases
# GitHub repo for a newer signed build — Compy's ONLY outbound call. Update packages are
# minisign(Ed25519)-verified against the pubkey in tauri.conf.json before install; the private
# key lives OUTSIDE the repo (owner machine, %USERPROFILE%\.tauri\ + owner backup) per the
# same key law as remote-rules signing.
tauri-plugin-updater = "2"
# relaunch() so "Update now" can restart into the new build after the installer runs.
tauri-plugin-process = "2"
# Tier 2 usage receipts (Q9a, #217) — the ONE HTTP client in the crate, and the SECOND outbound
# surface after the signed updater. Named exception under the Capability Exception Gate:
# docs/decisions/2026-08-18-outbound-capability-expansion.md §2, owner sign-off 2026-08-09.
# It is already linked into every shipped build (tauri-plugin-updater depends on it), so declaring
# it here compiles nothing new — it makes the dependency VISIBLE instead of transitive.
# The send path lives ONLY in src-tauri/src/receipts.rs and refuses while receipts_gate() is false
# — pinned by src/support-evidence-outbound-guard.test.ts.
# NO TLS FEATURE IS NAMED HERE, and that is the whole point. Enabling reqwest 0.13's `rustls`
# feature pulls aws-lc-rs, aws-lc-sys (a C/assembly crypto library needing cmake) and quinn —
# MEASURED: 11 new crates in Cargo.lock. Feature unification already gives reqwest its TLS from
# tauri-plugin-updater, so `json` alone adds nothing to the lockfile at all. Verified, not assumed:
# scripts/usage-endpoint-guard.test.mjs pins the declaration, and  shows
# reqwest resolving with __rustls either way.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
# The rustls crypto provider, named so Compy can install it ITSELF.
#
# bug->guard (#220, 2026-08-25): reqwest here has no TLS provider of its own — it inherits rustls
# from tauri-plugin-updater through feature unification, and THAT plugin installs the process-wide
# provider only when an update check actually runs (tauri-plugin-updater-2.10.1/src/updater.rs:448).
# `reqwest::Client::builder().build()` PANICS when no provider is installed, so any outbound call
# that happens before the first update check would take the app down. Found by the Tier 1 transport
# tests, which build a client in a unit test where no updater has ever run.
# MEASURED, not assumed: rustls 0.23.42 and ring 0.17.14 are already in Cargo.lock, so declaring
# them adds ZERO packages — it makes an existing transitive dependency nameable.
# NOTE FOR THE RECEIPTS LANE: src-tauri/src/receipts.rs has the same latent panic and is still dark.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Remember last window size/position (tester gripe 2026-07-23: the 800x600 default was too
# small — the intuitive fix is BOTH a larger first-run default (1280x720, tauri.conf.json)
# AND respecting whatever size the user then chooses). Overlay window denylisted in lib.rs —
# it positions/sizes itself programmatically and must never be "restored".
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
wmi = "0.14"
winreg = "0.55"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
# NOTE: the `runas` crate (1.2.0) was REMOVED 2026-07-14 — its Windows impl never returns Err
# (ShellExecuteExW failure, incl. a UAC decline, collapses to Ok(exit -1)), which inverted the
# decline attribution at the elevation boundary. Replaced by actions::elevate_and_wait.
winapi = { version = "0.3", features = [
  "wingdi",
  "winuser",
  "minwindef",
  "sysinfoapi",
  # Hidden-window + Raw Input session for the latency module's HID polling-rate probe
  # (latency.rs). GetModuleHandleW needs libloaderapi; HWND/window handles need windef.
  # Read-only passive input observation — no injection, no hook, no elevation.
  "libloaderapi",
  "windef",
] }
windows = { version = "0.59", features = [
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  # D3D11 compute + runtime HLSL compile (D3DCompile) for the GPU benchmark
  # (F6, benchmark.rs). Vendor graphics API, anti-cheat-safe — same class as the
  # existing DXGI/ADLX usage; no injection, no kernel driver.
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D_Fxc",
  # Gdi feature is required to use DXGI_OUTPUT_DESC1 (which carries HMONITOR
  # in its body, defined in the Gdi module). Used by HDR capability probe.
  # Also provides MonitorFromWindow / GetMonitorInfoW / MONITORINFO for the
  # frameless-window maximize fix (constrain maximize to the monitor work area).
  "Win32_Graphics_Gdi",
  # Window subclassing (SetWindowSubclass/DefSubclassProc) + MINMAXINFO/WM_GETMINMAXINFO
  # so the decorations:false main window's native maximize stops at the monitor work area
  # instead of covering the taskbar. Read-only window-message handling — no injection, no
  # hook into other processes, no elevation.
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  # DwmSetWindowAttribute(DWMWA_WINDOW_CORNER_PREFERENCE) to round the frameless window's corners on
  # Win11 so it reads as a polished app window, not a hard rectangle. No-op on Win10. Cosmetic.
  "Win32_Graphics_Dwm",
  # QueryPerformanceFrequency, for converting ETW present-event QPC
  # timestamps into milliseconds in the FPS/frametime capture engine.
  "Win32_System_Performance",
  # GetLogicalProcessorInformationEx, for CPU core/cache topology. The latency
  # module counts L3 cache complexes (≈ CCDs on AMD Zen) so it only offers
  # interrupt-affinity tweaks where they're meaningful (multi-CCD), and refuses
  # them on single-CCD parts (e.g. an 8-core X3D) — read-only, no elevation.
  "Win32_System_SystemInformation",
  # OpenProcess + QueryFullProcessImageNameW, so the elevated FPS helper can
  # resolve the presenting process's name (it has the rights; the UI doesn't).
  "Win32_System_Threading",
  # Read HWiNFO's published sensor block (shared memory-mapped file) for CPU temp — read-only,
  # no driver of our own. OpenFileMappingW / MapViewOfFile. See cpu_temp.rs.
  "Win32_System_Memory",
  "Win32_Foundation",
  # actions::elevate_and_wait (the UAC "runas" launch for the elevated self-helper + FPS capture
  # helper): CoInitializeEx = ShellExecuteExW's documented COM setup; Registry because
  # SHELLEXECUTEINFOW embeds an HKEY, so the windows crate gates ShellExecuteExW behind it.
  "Win32_System_Com",
  "Win32_System_Registry",
] }

# ETW (Event Tracing for Windows) consumer for FPS / frametime capture.
# Sentinel's --fps-capture helper subscribes to the Microsoft-Windows-DXGI
# provider's present events to derive frame timing from OUTSIDE the game —
# no DLL injection, the same anti-cheat-safe mechanism Intel PresentMon uses.
# Creating a real-time ETW session requires elevation, so this runs in an
# elevated helper process (see fps.rs).
ferrisetw = "1.2"
# Signed-manifest infra (ARCHITECTURE_LOCKS §1.4).
#
# Ed25519 signature verification for remote rules manifests. We use
# `ed25519-compact` rather than `ed25519-dalek`: it's pure-Rust with a tiny
# dependency tree and crucially does NOT pull the transitive
# `signature`/`hex 0.4.3` chain that broke the dalek build on current stable.
# Verification is now REAL (see verify_manifest_with_key in lib.rs); remote
# fetch stays disabled (remote_fetch_enabled()=false) until a production
# public key replaces the all-zeros placeholder. sha2 provides the SHA-256
# used to bind the rules file to the signed manifest.
ed25519-compact = "2"
sha2 = "0.10"

# NVIDIA Management Library wrapper. Used by the Monitoring tab to surface
# GPU temperature, utilization, clocks, power, and VRAM. nvml.dll ships with
# the NVIDIA driver — when the driver is absent (AMD/Intel-only systems, or
# NVIDIA driver not installed), Nvml::init() returns Err and the Monitoring
# tab falls back to "GPU sensors unavailable" instead of crashing. Anti-cheat
# safe — NVML is a vendor-blessed signed library, no injection, no kernel
# driver.
nvml-wrapper = "0.10"

# AMD GPU telemetry via ADLX (AMD Device Library eXtra). Dynamically loads
# amdadlx64.dll, which ships with the Adrenalin driver — same model as NVML
# for NVIDIA, and equally anti-cheat-safe (vendor library, no injection, no
# kernel driver). Pinned to the exact alpha because the crate is pre-1.0;
# the API we use (helper -> system -> performance_monitoring_services ->
# current_gpu_metrics) is stable across the metrics we read. From Traverse
# Research (maintainers of gpu-allocator). ADLX objects are COM-like and
# not thread-safe, so Sentinel runs all ADLX calls on a single dedicated
# poller thread (see amd_poller_loop in lib.rs).
adlx = "=0.0.0-alpha.1"

