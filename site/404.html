<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 — no signal · Compy</title>
<meta name="description" content="This route returned nothing. The rest of compy.gg is intact." />
<meta name="robots" content="noindex" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#050403" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<!-- Self-contained by design: a 404 can be served for any path, so every link is root-absolute
     and the styling is inline (no stylesheet fetch to fail). No JS. -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100svh; display: flex; flex-direction: column;
    background: #050403; color: #f2ede4;
    font-family: "Segoe UI", Seravek, Avenir, Verdana, system-ui, sans-serif;
  }
  .mono { font-family: "Cascadia Mono", Consolas, ui-monospace, monospace; }
  main {
    flex: 1; width: min(680px, 100% - 48px); margin: 0 auto;
    display: flex; flex-direction: column; justify-content: center;
    padding: 64px 0 48px;
  }
  .kicker {
    font-family: "Cascadia Mono", Consolas, ui-monospace, monospace;
    font-size: 13px; letter-spacing: 0.14em; color: #847d70; margin: 0 0 18px;
  }
  h1 {
    font-size: clamp(34px, 7vw, 56px); line-height: 1.05; margin: 0 0 26px;
    letter-spacing: -0.02em; text-wrap: balance;
  }
  .trace {
    border-top: 1px solid rgba(242, 237, 228, 0.09);
    margin: 0 0 34px; padding: 0;
  }
  .trace div {
    display: flex; justify-content: space-between; gap: 24px;
    border-bottom: 1px solid rgba(242, 237, 228, 0.09);
    padding: 11px 2px;
    font-family: "Cascadia Mono", Consolas, ui-monospace, monospace;
    font-size: 13.5px;
  }
  .trace dt { color: #847d70; margin: 0; }
  .trace dd { color: #a89f92; margin: 0; text-align: right; }
  .trace .hot dd { color: #ff9a1e; }
  .actions { display: flex; gap: 14px; flex-wrap: wrap; }
  .btn {
    display: inline-block; padding: 12px 22px; border-radius: 10px;
    font-family: "Cascadia Mono", Consolas, ui-monospace, monospace;
    font-size: 14px; text-decoration: none;
  }
  .btn-primary { background: #ff9a1e; color: #140a00; }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-ghost { color: #ff9a1e; border: 1px solid rgba(255, 154, 30, 0.35); }
  .btn-ghost:hover { border-color: #ff9a1e; }
  a:focus-visible { outline: 2px solid #ff9a1e; outline-offset: 2px; }
  footer {
    border-top: 1px solid rgba(242, 237, 228, 0.09);
    padding: 22px 0 30px; font-size: 13.5px; color: #847d70;
  }
  footer .wrap {
    width: min(680px, 100% - 48px); margin: 0 auto;
    display: flex; justify-content: space-between; gap: 18px; flex-wrap: wrap;
  }
  footer a { color: #ff9a1e; text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <p class="kicker">TRACE&nbsp;//&nbsp;404</p>
  <h1>No signal on this route.</h1>
  <dl class="trace">
    <div class="hot"><dt>STATUS</dt><dd>404 — not found</dd></div>
    <div><dt>ROUTE</dt><dd>returned nothing</dd></div>
    <div><dt>SITE</dt><dd>intact — everything else is where it should be</dd></div>
  </dl>
  <div class="actions">
    <a class="btn btn-primary" href="/">← Back to compy.gg</a>
    <a class="btn btn-ghost" href="/library/">Browse the Blackbook</a>
  </div>
</main>
<footer>
  <div class="wrap">
    <span><a href="/privacy.html">Privacy</a> · <a href="/eula.html">Terms</a></span>
    <span>© 2026 Pootytxng · Compy is in private beta</span>
  </div>
</footer>
</body>
</html>
