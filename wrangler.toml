# Cloudflare Pages config for the dark site (spec 2026-06-12-waitlist-wiring).
# Drives `npx wrangler pages deploy`: uploads dist-site/ (the gitignored publish artifact,
# rebuilt from committed sources), bundles functions/ (the same-origin endpoints), and applies
# the D1 bindings to the `compy` Pages project. No secrets live here — a database_id is an
# identifier, not a credential; auth is wrangler's local OAuth.
name = "compy"
pages_build_output_dir = "dist-site"
compatibility_date = "2026-06-12"

[[d1_databases]]
binding = "DB"
database_name = "compy_waitlist"
database_id = "74810997-9c7e-4fba-8d11-2eacbd6ba685"
# Schema lives in migrations/ (0001_waitlist.sql), reproducible via
# `wrangler d1 migrations apply compy_waitlist`. Explicit so the dir isn't a magic default.
migrations_dir = "migrations"

# Tier 2 usage receipts (Q9a) and, later and separately, Tier 3 case evidence (Q9b).
# A SECOND database rather than a second table in compy_waitlist, because a waitlist row is an
# identified record and a usage receipt is not — they must never be joinable or queryable together.
# Destination fixed by the B_land owner decision, 2026-08-18.
[[d1_databases]]
binding = "REPORTS"
database_name = "compy_reports"
database_id = "73f5e8a3-1827-42e3-8543-9fedc3750532"
# Its own migrations dir: wrangler tracks applied migrations per database, so sharing migrations/
# would make each database try to run the other's schema.
migrations_dir = "migrations-reports"
