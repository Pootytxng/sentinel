<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Simplified C-only mark for tiny .ico layers (16/24px) — pulse dropped + halo dropped + the C
       stroke bolded, per settings-and-icon spec B3 graceful degradation. Larger layers use the full
       pulse-c master. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142a26"/>
      <stop offset="1" stop-color="#0a0e12"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="240" fill="url(#tile)" stroke="#ffffff" stroke-opacity="0.10" stroke-width="16"/>
  <path d="M684 300 A256 256 0 1 0 684 724" fill="none" stroke="#2ee6c0" stroke-width="156" stroke-linecap="round"/>
</svg>
